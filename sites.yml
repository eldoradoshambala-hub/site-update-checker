# 監視するサイトの一覧。
#
# 追加するときは sites: の下に url を1件書き足すだけで動きます。
# 変更は次回の巡回（JST 07:00 / 12:00 / 21:00）から反映されます。
#
# よく使う任意項目:
#   selector: "ul.news a"   記事リンクを絞り込む CSS セレクタ。うまく取れないときだけ指定する
#   include:  ["/news/"]    URL にこの文字列を含むリンクだけを新着候補にする
#   exclude:  ["/tag/"]     URL にこの文字列を含むリンクを除外する
#   enabled:  false         一時的に巡回を止める
#
# 何を指定すればよいか分からないときは、先に抽出結果を見てから決められます:
#   python -m checker inspect https://example.com/news/

defaults:
  # 同時に巡回するサイト数。
  concurrency: 4
  # 1サイトあたりの取得タイムアウト（秒）。
  timeout: 20
  # 失敗したときの再試行回数。
  retries: 2
  # 画面に残す新着履歴の件数（サイトごと）。
  max_items: 50

sites:
  # トップページ（https://www.cjnavi.co.jp/）には、おすすめ記事やAD枠に
  # 過去記事がローテーション表示される部分があり、巡回のたびに古い記事が
  # 新着として誤検知された（実際に2024年・2025年の記事が6件出た）。
  # サイト自身の新着記事一覧ページを見ることで、掲載順が更新順に固定される。
  - id: cjnavi
    name: シティ情報ふくしま（新着記事）
    url: https://www.cjnavi.co.jp/all/

  # 記事は /articles/<slug>。
  # /search?q=... はタグリンクで、記事が増えるたびに新しいものが現れて
  # 新着と誤検知するため除外する。それ以外は将来の新しいパスも拾えるよう残す。
  - id: ledge-ai
    name: Ledge.ai（AIニュース）
    url: https://ledge.ai/
    exclude: ["/search?"]

  # --- ここから下は動作確認用のサンプルです。不要になったら削除してください ---

  # 実巡回で20件のプレスリリースが取れることを確認済み。
  - id: meti-press
    name: 経済産業省 ニュースリリース
    url: https://www.meti.go.jp/press/index.html
    include: ["/press/"]

  # 動作するが、トップページに載る記事が数件と少なく年別アーカイブが多め。
  - id: soumu-news
    name: 総務省 報道資料
    url: https://www.soumu.go.jp/menu_news/s-news/index.html
    include: ["/menu_news/s-news/"]

  # 気象庁（https://www.jma.go.jp/jma/press/index.html）と
  # 首相官邸（https://www.kantei.go.jp/jp/headline/index.html）も試しましたが、
  # 前者は記事リンクが通常の <a href> として出ておらず抽出できず、
  # 後者は HTTP 404 だったため外しました。
