name: テスト

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "data/**"
      - "docs/data/**"
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存をインストール
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: python -m pytest -q
